<app-section-accordion sectionName="Card Set">
    <div>
        @for (set of cardSets(); track set.set_code) {

        <div class="accordion-item">
            <strong>
                {{ set.set_name }}
            </strong>

            <span>
                {{ set.set_rarity }} -
                {{ set.set_price}}
            </span>
        </div>

        } @empty {
        <p>N/A</p>
        }
    </div>
</app-section-accordion>
