<div class="card-page">
    <header class="page-header">
        <h1 class="page-title">
            Yugioh Cards
        </h1>

        <p class="page-description">
            Search a lot of cards, you are able to make decks, change things and explore in a free way. Try writting the
            card you are searching for
        </p>
    </header>
    <app-searchbox (search)="letsSearch($event)" [searchValue]="cardsService.search()"> </app-searchbox>
    @if (isLoading())
    {
    <app-loading-spinner></app-loading-spinner>

    }
    @else if (apiError())
    {
    <hr/>

    <!--<div>An error has occurred while loading the data. {{errorMessage()}} </div> -->
    <div>An error has occurred while loading the data. {{apiError()?.resolution}} </div> 
    }
    @else {
    <app-card-list [cards]="cards()?.data || []" [loading]="isLoading()"></app-card-list>

    <app-paginator [currentPage]="cardsService.page() || 1" [totalPages]="cards()?.meta?.total_pages || 1"
        (pageChange)="cardsService.page.set($event)"></app-paginator>

    }

</div>
