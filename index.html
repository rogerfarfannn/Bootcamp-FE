    <link rel="stylesheet" href="index.css">

<body class="main-element">
   <my-target 
   id = "my-target"
   bg-color = "black"
   class="my-target"

        <p slot="card-name">Son Goku</p>
        <p slot="role">Super Hero</p>
   </my-target>
   <button onclick="changeColor()">
    Change color
   </button>
</body>
<script>
    const changeColor = ()=>{
        let myTarget = document.getElementById("my-target");
        myTarget.setAttribute("bg-color", "red");
    }
</script>
